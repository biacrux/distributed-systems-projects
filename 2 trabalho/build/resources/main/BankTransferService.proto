syntax = "proto3";
option java_package = "pt.ipb.dsys.assessment.two";
option java_multiple_files = true;

import "Common.proto";

message BankAccount{
  int64 id = 1 ;
  string name = 2;
  double balance = 3;
}

message BankAccountList{
    repeated BankAccount accounts = 1;
}

message TransferRequest{
    int64 src = 1;
    int64 dst = 2;
    double amount = 3;
}

message TransferResponse{
  string result = 1;
}

message AccountBalanceRequest{
  int64 id = 1;
}

message AccountBalanceResponse{
  double balance= 1;
}

service BankTransferService{
  rpc create(BankAccountList) returns (Void);
  rpc transfer(TransferRequest) returns (TransferResponse);
  rpc balance(AccountBalanceRequest) returns (AccountBalanceResponse);
  rpc reset(Void) returns (Void);
}